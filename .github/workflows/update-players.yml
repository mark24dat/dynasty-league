# Optional: auto-rebuild players.json when you commit a new sheet export.
# Put your Google Sheet CSV export at data/sheet-export.csv, then push.
name: Update player rankings

on:
  push:
    paths:
      - "data/sheet-export.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build players.json from CSV
        run: node scripts/build-players.js data/sheet-export.csv
      - name: Commit updated players.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git diff --staged --quiet || git commit -m "Update player rankings from spreadsheet"
          git push
