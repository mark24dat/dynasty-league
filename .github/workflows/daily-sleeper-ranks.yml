# Free daily update: merges Sleeper search_rank into data/players.json (no API key).
name: Daily Sleeper rank merge

on:
  schedule:
    - cron: "20 12 * * *" # ~7:20 AM Eastern (varies with DST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge Sleeper ranks into players.json
        run: node scripts/daily-sleeper-merge.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update: merge Sleeper ranks into player list"
            git push
          fi
