# Daily roster sync from ESPN Fantasy (writes data/league-espn.json).
# 1. Set leagueId and enabled in data/espn-config.json (commit to repo).
# 2. Public league: no secrets. Private: add repo secrets ESPN_S2 and SWID.

name: ESPN league sync

on:
  schedule:
    - cron: "35 11 * * *" # ~6:35 AM US Eastern (UTC+ offset varies)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch ESPN rosters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/fetch-espn-league.js

      - name: Commit league-espn.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/league-espn.json ]; then
            echo "No league-espn.json (ESPN sync disabled or not run yet)."
            exit 0
          fi
          git add data/league-espn.json
          if git diff --staged --quiet; then
            echo "No roster changes to commit."
          else
            git commit -m "Sync rosters from ESPN fantasy league"
            git push
          fi
